<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turtle 3D</title>
<style>
  :root { --ink:#f3f1ea; --dim:#f3f1ea99; --glass:#0d1214b8; --line:#ffffff24; --hit:#7fd18c; --warn:#e8b65a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#8fa3b3; overflow:hidden; color:var(--ink);
    font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  canvas { position:fixed; inset:0; display:block; }
  /* Cheap lens falloff: a CSS overlay costs no shader time */
  #lens { position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%, transparent 52%, #06121c66 100%); }
  .mono { font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; font-variant-numeric:tabular-nums; }

  #hud { position:fixed; top:16px; left:16px; right:16px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; text-shadow:0 1px 3px #0009; }
  #brand { font-weight:650; letter-spacing:.02em; font-size:17px; }
  #inst { text-align:right; font-size:13px; line-height:1.5; }
  #inst b { font-weight:600; font-size:19px; }
  #inst span { color:var(--dim); }
  #fps { color:var(--dim); display:none; }

  #panel { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); width:min(460px,calc(100vw - 32px)); display:flex; flex-direction:column; gap:6px; }
  #rows { display:flex; flex-direction:column; gap:4px; }
  .row { display:grid; grid-template-columns:1fr auto auto auto; gap:12px; align-items:center; padding:7px 12px; border-radius:8px; background:var(--glass); backdrop-filter:blur(10px); border:1px solid var(--line); animation:in .3s ease-out; }
  .row .city { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .pct { width:42px; text-align:right; color:var(--warn); }
  .row.hit .pct, .row.hit .city { color:var(--hit); font-weight:600; }
  .row .dir { display:inline-block; width:16px; text-align:center; }
  @keyframes in { from { opacity:0; transform:translateY(6px);} }
  #box { position:relative; }
  #q { width:100%; padding:13px 58px 13px 14px; border-radius:10px; font:inherit; font-size:16px; color:var(--ink); background:var(--glass); backdrop-filter:blur(10px); border:1px solid var(--line); outline:none; }
  #q:focus { border-color:#ffffff70; }
  #q::placeholder { color:var(--dim); }
  #count { position:absolute; right:14px; top:14px; color:var(--dim); font-size:13px; }
  #sug { position:absolute; bottom:calc(100% + 4px); left:0; right:0; margin:0; padding:4px; list-style:none; border-radius:10px; background:#0d1214ee; border:1px solid var(--line); max-height:228px; overflow:auto; }
  #sug:empty { display:none; }
  #sug li { padding:7px 10px; border-radius:6px; cursor:pointer; }
  #sug li small { color:var(--dim); margin-left:6px; }
  #sug li.on, #sug li:hover { background:#ffffff1f; }

  #end { display:none; padding:14px; border-radius:10px; background:var(--glass); backdrop-filter:blur(10px); border:1px solid var(--line); }
  #end h2 { margin:0 0 2px; font-size:21px; }
  #end p { margin:0 0 10px; color:var(--dim); }
  #end .acts { display:flex; gap:8px; }
  button { font:inherit; color:var(--ink); padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:#ffffff1a; cursor:pointer; }
  button:hover { background:#ffffff33; }
  #credits { margin-top:10px; font-size:11.5px; color:var(--dim); }

  .pin { position:fixed; transform:translate(-50%,-100%); font-size:12.5px; font-weight:600; padding:3px 8px; border-radius:5px; background:#0d1214cc; white-space:nowrap; pointer-events:none; }
  .pin::after { content:""; position:absolute; left:50%; top:100%; width:1px; height:18px; background:#ffffffb0; }

  #flyHint { display:none; position:fixed; left:50%; bottom:16px; transform:translateX(-50%); padding:7px 12px; border-radius:8px; font-size:12.5px; white-space:nowrap; color:var(--dim); background:var(--glass); backdrop-filter:blur(10px); border:1px solid var(--line); pointer-events:none; }
  #flyHint b { color:var(--ink); font-weight:600; }
  body.flying #panel { display:none; }
  body.flying #flyHint { display:block; }
  body.flying canvas { cursor:none; }
  @media (max-width:640px) { #flyHint { white-space:normal; width:calc(100vw - 32px); text-align:center; } }

  #load { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:#101619; transition:opacity .9s; z-index:5; }
  #load .bar { width:220px; height:2px; background:#ffffff22; }
  #load .bar i { display:block; height:100%; width:0; background:var(--ink); transition:width .15s; }
  #load small { color:var(--dim); }
  @media (max-width:560px) { #inst b { font-size:16px; } .row { gap:8px; } }
  @media (prefers-reduced-motion:reduce) { .row { animation:none; } }
</style>
</head>

const maxAniso = renderer.capabilities.getMaxAnisotropy();

// Tileable fbm noise, used for clouds, water ripples and leaf speckle.
function noiseTexture(size = 256) {
  const data = new Uint8Array(size*size*4);
  const layer = (n, seed) => { const g = new Float32Array(n*n); let s = seed; for (let i = 0; i < n*n; i++) { s = (s*1664525+1013904223)>>>0; g[i] = s/4294967296; }
    return (x, y) => { const fx = x*n, fy = y*n, ix = Math.floor(fx), iy = Math.floor(fy); let tx = fx-ix, ty = fy-iy; tx = tx*tx*(3-2*tx); ty = ty*ty*(3-2*ty);
      const at = (a,b) => g[((b%n+n)%n)*n+((a%n+n)%n)];
      return (at(ix,iy)*(1-tx)+at(ix+1,iy)*tx)*(1-ty)+(at(ix,iy+1)*(1-tx)+at(ix+1,iy+1)*tx)*ty; }; };
  const ls = [4,8,16,32,64].map((n,i) => [layer(n,i*97+11), .5**i]);
  const ls2 = [32,64,128].map((n,i) => [layer(n,i*53+7), .5**i]);
  const sum = (arr,x,y) => arr.reduce((t,[f,w]) => t+f(x,y)*w, 0)/arr.reduce((t,[,w]) => t+w, 0);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) { const i = (y*size+x)*4;
    data[i] = 255*sum(ls,x/size,y/size); data[i+1] = 255*sum(ls2,x/size,y/size); data[i+2] = 0; data[i+3] = 255; }
  const t = new THREE.DataTexture(data, size, size); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true; t.needsUpdate = true;
  return t;
}
const shared = { uTime:{value:0}, uNoise:{value:noiseTexture()}, uSun:{value:SUN}, uHaze:{value:HAZE}, uGamma:{value:C.gamma}, uSat:{value:C.sat},
  uTint:{value:new THREE.Vector3(...C.tint)}, uStoneA:{value:new THREE.Vector3(...C.stone[0])}, uStoneB:{value:new THREE.Vector3(...C.stone[1])}, uWall:{value:C.wall ?? 1}, uWaterFlat:{value:C.waterFlat ?? 0} };

// ---------------------------------------------------------------- shaders
const COMMON = /* glsl */`
  uniform float uTime, uGamma, uSat, uWall, uWaterFlat; uniform sampler2D uNoise; uniform vec3 uSun, uHaze, uTint, uStoneA, uStoneB;
  vec3 grade(vec3 c){                          // per-city: each survey has its own exposure, season and shadow depth
    c = pow(c, vec3(uGamma)) * uTint;
    float l = dot(c, vec3(.3,.59,.11));
    return mix(vec3(l), c, uSat);
  }
  float cloudAt(vec2 p){ return texture2D(uNoise, p/9000. + vec2(uTime*.0009,uTime*.0004)).r*.72 + texture2D(uNoise, p/3100. - vec2(uTime*.0007,0.)).r*.28; }
  float cloudShade(vec3 wp){                   // soft moving shadows from the cloud layer overhead
    vec2 p = wp.xz - uSun.xz/uSun.y * (700. - wp.y);
    return 1. - .26*smoothstep(.6,.72,cloudAt(p));
  }
  vec3 atmos(vec3 c, vec3 wp){                 // aerial perspective
    float d = length(wp-cameraPosition);
    return mix(c, uHaze, 1.-exp(-d*.000105));
  }`;

const groundMat = (map, rect, mask) => new THREE.ShaderMaterial({

    const corner = (h,i,j) => { const o = outer(h), w = legW(h); return v(sx*(o-(i?w:0)), h, sz*(o-(j?w:0))); };
    for (let L = 0; L < levels.length-1; L++) { const h0 = levels[L], h1 = levels[L+1], t = h0 < 115 ? 1.5 : 1.05;
      for (const [i,j] of [[0,0],[1,0],[0,1],[1,1]]) {
        beam(corner(h0,i,j), corner(h1,i,j), t*1.5);
        const [a,b] = i === j ? [[1-i,j],[i,1-j]] : [[j,i],[i,j]];
        beam(corner(h0,i,j), corner(h1,a[0],a[1]), t*.8);       // cross-bracing
        beam(corner(h0,b[0],b[1]), corner(h1,i,j), t*.8);
        beam(corner(h1,0,0), corner(h1,1,0), t*.7); beam(corner(h1,0,1), corner(h1,1,1), t*.7);
        beam(corner(h1,0,0), corner(h1,0,1), t*.7); beam(corner(h1,1,0), corner(h1,1,1), t*.7);
      }
    }
    // Iconic arch below the first platform, on the two sides of each leg
    for (const axis of [0,1]) { const N = 14; for (let i = 0; i < N; i++) {
      const pt = k => { const u = k/N, w = Math.cos(u*Math.PI/2), hh = 39*Math.sin(u*Math.PI/2)+2, o = outer(hh)-legW(hh);
        return axis ? v(sx*o, hh, sz*w*o*.999) : v(sx*w*o*.999, hh, sz*o); };
      beam(pt(i), pt(i+1), 1.8); } }
  }
  const ring = (h, half, thick, d) => {
    box(0,h,half-d/2,half,thick,d/2); box(0,h,-half+d/2,half,thick,d/2); box(half-d/2,h,0,d/2,thick,half); box(-half+d/2,h,0,d/2,thick,half);
  };
  ring(57, outer(57)+3, 3.5, 17); ring(115, outer(115)+2.5, 3, 12);
  box(0,276,0,outer(276)+4,3,outer(276)+4);
  box(0,286,0,5.5,7,5.5);
  for (let h = 293; h < 322; h += 6) box(0,h+3,0,3-(h-293)*.07,3,3-(h-293)*.07);
  box(0,326,0,.9,5,.9);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3));
  paint(g, () => [.40,.325,.255]);                          // "Eiffel brown"
  addModel(g, 48.85826, 2.29450, Math.PI/4+.04);            // the square is turned about 45° from true north
}

function buildSky() {
  // One translucent cloud deck under the aircraft: strong parallax, one quad of overdraw.
  const g = new THREE.PlaneGeometry(50000,50000); g.rotateX(-Math.PI/2);
  const m = new THREE.Mesh(g, new THREE.ShaderMaterial({ transparent:true, depthWrite:false, side:THREE.DoubleSide, uniforms:{...shared},
    vertexShader:`varying vec3 vP; void main(){ vec4 w = modelMatrix*vec4(position,1.); vP = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
    fragmentShader:`${COMMON} varying vec3 vP;
      void main(){
        float n = cloudAt(vP.xz);
        float det = texture2D(uNoise, vP.xz/620.+uTime*.002).r;
        float a = smoothstep(.61,.78, n+(det-.5)*.12);
        vec3 c = mix(vec3(.84,.87,.91), vec3(1.), smoothstep(.58,.8,n));
        gl_FragColor = vec4(atmos(c,vP), a*.62);
      }` }));
  m.position.y = 700; m.renderOrder = 10; m.frustumCulled = false; scene.add(m);
  return m;
}
function buildDome() {        // only ever seen in free flight: the plane's own camera never reaches the horizon
  const m = new THREE.Mesh(new THREE.SphereGeometry(60000, 32, 16), new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false, depthTest:false, uniforms:{...shared},
    vertexShader:`varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix*viewMatrix*vec4(position+cameraPosition,1.); }`,
    fragmentShader:`uniform vec3 uHaze, uSun; varying vec3 vD;
      void main(){
        vec3 d = normalize(vD);
        vec3 c = mix(uHaze, vec3(.27,.46,.72), smoothstep(.0,.42,d.y));
        float s = max(dot(d,uSun),0.);
        c += vec3(1.,.93,.8)*(pow(s,900.)*1.6 + pow(s,14.)*.16);
        gl_FragColor = vec4(c,1.);
      }` }));
  m.frustumCulled = false; m.renderOrder = -2; scene.add(m);
}

// ---------------------------------------------------------------- flight
let curve, curveLen, flightU = 0, altNow = ALTS[0], altGoal = ALTS[0], groundY = 0, clouds;
const pos = new THREE.Vector3(), ahead = new THREE.Vector3(), behind = new THREE.Vector3();
function buildRoute() {
  curve = new THREE.CatmullRomCurve3(ROUTE.map(([la,lo]) => { const [x,z] = toWorld(la,lo); return new THREE.Vector3(x,0,z); }), true, 'centripetal');
  curve.arcLengthDivisions = 2000; curveLen = curve.getLength();
  groundY = heightAt(0,0);
}
function fly(dt, t) {
  flightU = (flightU + dt*SPEED/curveLen) % 1;
  altNow += (altGoal-altNow)*(1-Math.exp(-dt*.42));
  curve.getPointAt(flightU, pos);
  curve.getPointAt((flightU+90/curveLen)%1, ahead);
  curve.getPointAt((flightU-90/curveLen+1)%1, behind);
  const a0 = Math.atan2(pos.x-behind.x, pos.z-behind.z), a1 = Math.atan2(ahead.x-pos.x, ahead.z-pos.z);
  let turn = a1-a0; turn = Math.atan2(Math.sin(turn),Math.cos(turn));
  const yaw = Math.atan2(ahead.x-behind.x, ahead.z-behind.z)+Math.PI;
  // Slow air-pocket wander; two incommensurate sines so it never visibly repeats.
  const w = .5*Math.sin(t*.31)+.5*Math.sin(t*.13+1.7), w2 = .5*Math.sin(t*.23+.4)+.5*Math.sin(t*.083);
  camera.position.set(pos.x, groundY+altNow+w*7, pos.z);
  camera.rotation.set(-1.02+w2*.012, yaw+w*.01, -turn*1.7+w2*.012);
  clouds.position.y = groundY+Math.min(altNow-170, 620);
  clouds.position.x = pos.x; clouds.position.z = pos.z;
  clouds.visible = true;
  $('alt').textContent = String(Math.round(altNow));
  let hdg = (360-yaw*180/Math.PI)%360; $('hdg').textContent = `HDG ${String(Math.round(hdg)).padStart(3,'0')}°`;
}

// ---------------------------------------------------------------- free flight, once the round is over
const free = { on:false, vel:new THREE.Vector3(), keys:new Set(), speed:90 };
const FLY_KEYS = new Set(['KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE','Space','KeyC','ShiftLeft','ShiftRight','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), wish = new THREE.Vector3();
const canFly = () => state.over;
function takeControl() {                 // the plane keeps flying until you first touch the controls
  if (!canFly() || free.on) return;
  free.on = true; document.activeElement?.blur?.();
}
const setFlying = v => document.body.classList.toggle('flying', v);
function freeFly(dt) {
  const k = free.keys, on = (...c) => c.some(x => k.has(x));
  camera.rotation.z *= Math.exp(-dt*3);  // ease out of the plane's bank
  camera.getWorldDirection(fwd); right.crossVectors(fwd, camera.up).normalize();
  wish.set(0,0,0)
    .addScaledVector(fwd, (on('KeyW','ArrowUp')?1:0)-(on('KeyS','ArrowDown')?1:0))
    .addScaledVector(right, (on('KeyD','ArrowRight')?1:0)-(on('KeyA','ArrowLeft')?1:0));
  wish.y += (on('KeyE','Space')?1:0)-(on('KeyQ','KeyC')?1:0);
  if (wish.lengthSq() > 1) wish.normalize();
  wish.multiplyScalar(free.speed*(on('ShiftLeft','ShiftRight')?7:1));
  free.vel.lerp(wish, 1-Math.exp(-dt*(wish.lengthSq() ? 5 : 3.5)));    // a little weight, and a glide when you let go
  camera.position.addScaledVector(free.vel, dt);
  // Noclip through buildings, but stay above the ground and over the data.
  const lim = META.far/2*.92, p = camera.position;
  p.x = Math.max(-lim,Math.min(lim,p.x)); p.z = Math.max(-lim,Math.min(lim,p.z));
  const ground = heightAt(p.x,p.z);
  p.y = Math.max(ground+2.5, Math.min(ground+9000, p.y));
  const agl = p.y-ground, near = Math.max(1, Math.min(30, agl*.08));     // tighter near plane only when you're close to things
  if (Math.abs(near-camera.near) > camera.near*.1) { camera.near = near; camera.updateProjectionMatrix(); }
  clouds.position.x = p.x; clouds.position.z = p.z;
  $('alt').textContent = String(Math.round(agl));
  const c = (Math.atan2(fwd.x,-fwd.z)*180/Math.PI+360)%360;
  $('hdg').textContent = `HDG ${String(Math.round(c)%360).padStart(3,'0')}°`;
}
function look(dx, dy) {
  takeControl(); if (!free.on) return;
  const r = camera.rotation;
  r.y -= dx*.0021; r.x = Math.max(-1.55, Math.min(1.55, r.x-dy*.0021));
}
function capture() {
  if (!canFly()) return;
  takeControl();
  const el = renderer.domElement;
  try { const p = el.requestPointerLock?.(); p?.catch?.(() => {}); } catch {}
  setFlying(true);
}
renderer.domElement.addEventListener('mousedown', capture);
document.addEventListener('pointerlockchange', () => { free.keys.clear(); setFlying(document.pointerLockElement === renderer.domElement); });
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement === renderer.domElement || (e.buttons && e.target === renderer.domElement)) look(e.movementX, e.movementY);   // drag still looks if the lock is refused
});
addEventListener('wheel', e => { if (free.on) free.speed = Math.max(10, Math.min(900, free.speed*Math.exp(-e.deltaY*.001))); }, { passive:true });
addEventListener('keydown', e => {
  if (!canFly() || e.ctrlKey || e.metaKey || !FLY_KEYS.has(e.code)) return;
  e.preventDefault(); free.keys.add(e.code);
  if (!e.code.startsWith('Shift')) { takeControl(); setFlying(true); }
});
addEventListener('keyup', e => { free.keys.delete(e.code); if (e.code === 'Escape' && !document.pointerLockElement) setFlying(false); });
addEventListener('blur', () => free.keys.clear());

// ---------------------------------------------------------------- game
const state = { guesses:[], over:false };
const hav = (a,b) => { const r = Math.PI/180, dLa = (b.lat-a.lat)*r, dLo = (b.lon-a.lon)*r, s = Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2; return 2*6371*Math.asin(Math.sqrt(s)); };
const bearing = (a,b) => { const r = Math.PI/180, y = Math.sin((b.lon-a.lon)*r)*Math.cos(b.lat*r), x = Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lon-a.lon)*r); return (Math.atan2(y,x)/r+360)%360; };
const ARROWS = ['⬆️','↗️','➡️','↘️','⬇️','↙️','⬅️','↖️'];
const norm = s => s.toLowerCase().replace(/å/g,'aa').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
let matches = [], sel = 0;

function renderSug() {
  const s = norm($('q').value);
  const used = new Set(state.guesses.map(g => g.city.name));
  matches = !s || state.over ? [] : CITIES.filter(c => !used.has(c.name) && norm(c.name).includes(s))
    .sort((a,b) => norm(b.name).startsWith(s)-norm(a.name).startsWith(s)).slice(0,6);
  sel = Math.min(sel, Math.max(0,matches.length-1));
  $('sug').replaceChildren(...matches.map((c,i) => { const li = document.createElement('li'); li.className = i===sel?'on':''; li.innerHTML = `${c.name}<small>${c.country}</small>`;
    li.onmousedown = e => { e.preventDefault(); guess(c); }; return li; }));
}
function guess(city) {
  if (state.over) return;
  const km = hav(city, ANSWER), hit = city.name === ANSWER.name;
  const g = { city, km, hit, dir: ARROWS[Math.round(bearing(city,ANSWER)/45)%8], pct: Math.max(0,Math.round(100*(1-km/20015))) };
  state.guesses.push(g);
  const row = document.createElement('div'); row.className = 'row'+(hit?' hit':'');
  row.innerHTML = `<span class="city">${city.name}</span><span class="mono">${hit?'':Math.round(km).toLocaleString('en')+' km'}</span><span class="dir">${hit?'🎯':g.dir}</span><span class="pct mono">${g.pct}%</span>`;
  $('rows').append(row);
  while ($('rows').children.length > 3) $('rows').firstChild.remove();   // keep the view clear
  $('q').value = ''; sel = 0; renderSug();
  $('count').textContent = `${state.guesses.length}/${MAX_GUESSES}`;
  if (hit || state.guesses.length >= MAX_GUESSES) return endGame(hit);
  altGoal = ALTS[state.guesses.length];
}
function endGame(won) {
  state.over = true; altGoal = 620;
  $('box').style.display = 'none'; $('end').style.display = 'block';
  $('endT').textContent = `${ANSWER.name}, ${ANSWER.country}`;
  $('endS').textContent = won ? `Spotted from ${Math.round(altNow).toLocaleString('en')} m, in ${state.guesses.length} of ${MAX_GUESSES}.` : `Out of guesses. The plane has seen enough.`;
  $('credits').textContent = C.credits;
  pins.forEach(p => p.el.style.display = 'block');
}
$('freeFly').onclick = capture;
$('again').onclick = () => { location.search = `?city=${ROTATION[(ROTATION.indexOf(CITY_ID)+1)%ROTATION.length]}`; };
$('share').onclick = async e => {
  const grid = state.guesses.map(g => g.hit ? '🟩🎯' : `${'🟨'.repeat(Math.max(1,Math.round(g.pct/20)))} ${g.dir}`).join('\n');
  try { await navigator.clipboard.writeText(`Turtle 3D ${state.guesses.at(-1).hit?state.guesses.length:'X'}/${MAX_GUESSES}\n${grid}`); e.target.textContent = 'Copied'; } catch { e.target.textContent = 'Copy failed'; }
  setTimeout(() => e.target.textContent = 'Copy result', 1400);
};
$('q').addEventListener('input', () => { sel = 0; renderSug(); });
$('q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { sel = Math.min(sel+1, matches.length-1); renderSug(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { sel = Math.max(sel-1, 0); renderSug(); e.preventDefault(); }
  if (e.key === 'Enter' && matches[sel]) guess(matches[sel]);
});
addEventListener('keydown', e => { if (e.key === 'F2') { const f = $('fps'); f.style.display = f.style.display === 'inline' ? 'none' : 'inline'; } });

let pins = [];
function buildPins() {
  pins = LANDMARKS.map(([name,la,lo,top=40]) => { const [x,z] = toWorld(la,lo), el = document.createElement('div'); el.className = 'pin'; el.textContent = name; el.style.display = 'none'; document.body.append(el);
    return { el, p:new THREE.Vector3(x, heightAt(x,z)+top, z) }; });
}
const tmp = new THREE.Vector3();
function updatePins() {
  if (!state.over) return;
  for (const { el, p } of pins) { tmp.copy(p).project(camera);
    const on = tmp.z < 1 && Math.abs(tmp.x) < 1 && Math.abs(tmp.y) < 1; el.style.display = on ? 'block' : 'none';
    if (on) { el.style.left = `${(tmp.x+1)/2*innerWidth}px`; el.style.top = `${(1-tmp.y)/2*innerHeight-18}px`; } }
}

// ---------------------------------------------------------------- loop, with a governor that protects 60 fps
const stats = { frames:0, ms:0, worst:0, recent:[] };
let last = performance.now(), fpsT = 0, fpsN = 0, slow = 0, frozen = false;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.1,(now-last)/1000); last = now;
  if (!frozen) { shared.uTime.value += dt; free.on ? freeFly(dt) : fly(dt, shared.uTime.value); }
  renderer.render(scene, camera);
  updatePins();
  stats.frames++; stats.ms += dt*1000; stats.worst = Math.max(stats.worst, dt*1000);
  fpsN++; fpsT += dt;
  if (fpsT >= 1) {
    const fps = fpsN/fpsT; $('fps').textContent = `${fps.toFixed(0)} fps · ${pixelRatio.toFixed(2)}x`;
    slow = fps < 54 ? slow+1 : 0;
    if (slow >= 2 && pixelRatio > .75 && !params.has('noadapt')) { pixelRatio = Math.max(.75, pixelRatio*.85); renderer.setPixelRatio(pixelRatio); slow = 0; }
    fpsN = fpsT = 0;
  }
}

// ---------------------------------------------------------------- boot
(async () => {
  try {
    await loadScript('meta'); META = T3.meta;
    const keys = []; for (let r = 0; r < META.rows; r++) for (let c = 0; c < META.cols; c++) keys.push(`g${r}${c}`);
    total = 4 + keys.length + 1 + META.rows*META.cols;
    $('loadMsg').textContent = 'Fetching the ground';
    await loadScript('terrain'); terrain = { ...T3.terrain, d:unb64(T3.terrain.d, Float32Array) }; delete T3.terrain; tick();
    await loadScript('water'); const mask = await waterMask(); tick();
    await loadScript('buildings'); tick(); await loadScript('trees'); tick();
    const flat = [];
    for (let i = 0; i < keys.length; i += 4) flat.push(...await Promise.all(keys.slice(i,i+4).map(loadTexture)));
    const maps = []; for (let r = 0; r < META.rows; r++) maps.push(flat.slice(r*META.cols,(r+1)*META.cols));
    const far = await loadTexture('far');
    $('loadMsg').textContent = 'Raising the city';
    buildGround(maps, mask);
    const fg = new THREE.PlaneGeometry(META.far, META.far); fg.rotateX(-Math.PI/2);
    const fm = new THREE.Mesh(fg, farMat(far)); fm.position.y = terrain.d.reduce((a,b) => Math.min(a,b), 1e9)-6;
    fm.material.depthWrite = false; fm.renderOrder = -1; fm.frustumCulled = false; scene.add(fm);
    // Far ring UVs run north-down, same as the image rows.
    await buildBuildings(maps); buildTrees(maps); C.model?.();
    clouds = buildSky(); buildDome(); buildRoute(); buildPins();
    flightU = params.has('u') ? +params.get('u') : .02;
    altNow = altGoal = ALTS[0];
    if (params.has('alt')) altNow = altGoal = +params.get('alt');
    fly(0, 0);
    renderer.compile(scene, camera);
    $('count').textContent = `0/${MAX_GUESSES}`;
    last = performance.now(); requestAnimationFrame(frame);
    $('load').style.opacity = 0; setTimeout(() => $('load').remove(), 950);
    if (!params.has('nofocus')) $('q').focus();
    window.__t3 = { free, city:CITY_ID, answer:ANSWER.name, landmark:LANDMARKS[0], stats, renderer, camera, freeze(v) { frozen = v; }, set(u, alt) { flightU = u; altNow = altGoal = alt; fly(0, shared.uTime.value); }, jump(x, z, alt, pitch=-1.2, yaw=0) { frozen = true; camera.position.set(x, groundY+alt, z); camera.rotation.set(pitch, yaw, 0); }, world:toWorld, renderInfo:() => renderer.info.render };
    window.__ready = true;
  } catch (err) {
    console.error(err); $('loadMsg').textContent = `Failed: ${err.message}`;
  }
})();
</script>
</body>
</html>
